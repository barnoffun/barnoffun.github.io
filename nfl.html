<style>
  :root {
    --surface-2: #ffffff;
    --surface-1: #f5f4f0;
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b68;
    --text-muted: #9a9a96;
    --border: #dddad2;
    --border-strong: #c4c1b9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-2: #232320;
      --surface-1: #2b2b28;
      --text-primary: #f2f2ef;
      --text-secondary: #b0b0ac;
      --text-muted: #85857f;
      --border: #3d3d38;
      --border-strong: #52524a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--surface-1);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-primary);
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: 3vmin;
  }
  button {
    background: var(--surface-2);
    border: 0.5px solid var(--border-strong);
    border-radius: 10px;
    color: var(--text-primary);
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: scale(0.98); background: var(--surface-1); }
</style>
</head>

</div>

let currentSet = "QB";
let cards = sets[currentSet].data;
let idx = 0;
let flipped = false;

function personRow(person) {
  let college = person[3] ? '<div style="font-size:clamp(11px,2.6vmin,13px);color:var(--text-muted);margin-top:0.1vh;">' + person[3] + '</div>' : '';
  return '<div style="padding:0.8vh 0;">' +
    '<span style="font-size:clamp(13px,3.4vmin,15px);font-weight:600;color:var(--text-primary);">#' + person[0] + ' ' + person[1] + '</span>' +
    '<span style="font-size:clamp(11px,2.6vmin,13px);color:var(--text-muted);"> (' + person[2] + ')</span>' +
    college +
    '</div>';
}

function render() {
  document.getElementById("progress").textContent = "Card " + (idx+1) + " of " + cards.length;
  let inner = document.getElementById("face-inner");
  let type = sets[currentSet].type;
  if (!flipped) {
    inner.innerHTML = '<p style="font-size:clamp(13px,3.2vmin,17px);color:var(--text-secondary);margin:0 0 2vh;">Team</p>' +
      '<p style="font-size:clamp(26px,9vmin,46px);font-weight:600;margin:0;line-height:1.2;">' + cards[idx][0] + '</p>';
  } else if (type === "roster") {
    let rows = cards[idx][1].map(function(qb, i) {
      let weight = i === 0 ? '600' : '400';
      let color = i === 0 ? 'var(--text-primary)' : 'var(--text-secondary)';
      let college = qb[3] ? '<div style="font-size:clamp(13px,3.4vmin,16px);color:var(--text-muted);margin-top:0.3vh;">' + qb[3] + '</div>' : '';
      return '<div style="padding:1.2vh 0;">' +
        '<div style="display:flex;gap:2vw;align-items:baseline;justify-content:center;flex-wrap:wrap;">' +
        '<span style="font-size:clamp(13px,3.4vmin,16px);color:var(--text-muted);">#' + qb[0] + '</span>' +
        '<span style="font-size:clamp(18px,5vmin,22px);font-weight:' + weight + ';color:' + color + ';">' + qb[1] + '</span>' +
        '<span style="font-size:clamp(13px,3.4vmin,16px);color:var(--text-muted);">(' + qb[2] + ')</span>' +
        '</div>' + college +
        '</div>';
    }).join('');
    let label = currentSet === "RB" ? "running backs" : "quarterbacks";
    inner.innerHTML = '<p style="font-size:clamp(13px,3.2vmin,17px);color:var(--text-secondary);margin:0 0 1.5vh;">' + cards[idx][0] + ' ' + label + '</p>' + rows;
  } else if (type === "kp") {
    let rows = cards[idx][1].map(function(p) {
      let college = p[3] ? '<div style="font-size:clamp(13px,3.4vmin,16px);color:var(--text-muted);margin-top:0.3vh;">' + p[3] + '</div>' : '';
      return '<div style="padding:1.2vh 0;">' +
        '<div style="display:flex;gap:2vw;align-items:baseline;justify-content:center;flex-wrap:wrap;">' +
        '<span style="font-size:clamp(13px,3.4vmin,16px);color:var(--text-muted);">#' + p[0] + '</span>' +
        '<span style="font-size:clamp(18px,5vmin,22px);font-weight:600;color:var(--text-primary);">' + p[1] + '</span>' +
        '<span style="font-size:clamp(13px,3.4vmin,16px);color:var(--text-muted);">(' + p[2] + ')</span>' +
        '</div>' + college +
        '</div>';
    }).join('');
    inner.innerHTML = '<p style="font-size:clamp(13px,3.2vmin,17px);color:var(--text-secondary);margin:0 0 1.5vh;">' + cards[idx][0] + ' specialists</p>' + rows;
  } else if (type === "wrte") {
    let team = cards[idx][1];
    let maxRows = Math.max(team.s.length, team.b.length);
    let wrRows = '';
    for (let i = 0; i < maxRows; i++) {
      wrRows += '<div style="display:flex;gap:3vw;">' +
        '<div style="flex:1;text-align:left;">' + (team.s[i] ? personRow(team.s[i]) : '') + '</div>' +
        '<div style="flex:1;text-align:left;">' + (team.b[i] ? personRow(team.b[i]) : '') + '</div>' +
        '</div>';
    }
    let teRows = '<div style="display:flex;gap:3vw;">' +
      '<div style="flex:1;text-align:left;">' + (team.te[0] ? personRow(team.te[0]) : '') + '</div>' +
      '<div style="flex:1;text-align:left;">' + (team.te[1] ? personRow(team.te[1]) : '') + '</div>' +
      '</div>';
    inner.innerHTML = '<p style="font-size:clamp(13px,3.2vmin,17px);color:var(--text-secondary);margin:0 0 1.5vh;">' + cards[idx][0] + ' receivers</p>' +
      wrRows +
      '<div style="border-top:0.5px solid var(--border);margin:1.5vh 0;"></div>' +
      teRows;
  } else {
    let rows = cards[idx][1].map(function(person) {
      let detail;
      if (person[2].indexOf('fmr. ') === 0) {
        let rest = person[2].slice(5).replace(/\s{2,}/g, ' ');
        detail = person[0] + ' (' + rest + ')';
      } else {
        detail = person[0] + ' &middot; ' + person[2];
      }
      return '<div style="padding:1.2vh 0;">' +
        '<span style="font-size:clamp(17px,4.6vmin,21px);font-weight:600;color:var(--text-primary);">' + person[1] + '</span>' +
        '<div style="font-size:clamp(13px,3.4vmin,16px);color:var(--text-muted);margin-top:0.3vh;">' + detail + '</div>' +
        '</div>';
    }).join('');
    inner.innerHTML = '<p style="font-size:clamp(13px,3.2vmin,17px);color:var(--text-secondary);margin:0 0 1.5vh;">' + cards[idx][0] + ' coaching staff</p>' + rows;
  }
}
function flipCard() {
  flipped = !flipped;
  render();
}
function nextCard() {
  idx = (idx+1) % cards.length;
  flipped = false;
  render();
}
function prevCard() {
  idx = (idx-1+cards.length) % cards.length;
  flipped = false;
  render();
}
function shuffleCards() {
  for (let i = cards.length-1; i>0; i--) {
    let j = Math.floor(Math.random()*(i+1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  idx = 0;
  flipped = false;
  render();
}

function toggleSetMenu() {
  let overlay = document.getElementById("setOverlay");
  let isOpen = overlay.style.display === "flex";
  if (isOpen) {
    overlay.style.display = "none";
  } else {
    renderSetList();
    overlay.style.display = "flex";
  }
}
function renderSetList() {
  let list = document.getElementById("setList");
  let names = Object.keys(sets);
  list.innerHTML = names.map(function(name) {
    let active = name === currentSet;
    let bg = active ? 'var(--surface-1)' : 'transparent';
    let weight = active ? '600' : '400';
    return '<button onclick="selectSet(\'' + name + '\')" style="width:100%;text-align:left;padding:2.2vh 3vmin;margin-bottom:1vh;background:' + bg + ';border:0.5px solid var(--border);border-radius:10px;font-size:clamp(15px,4.2vmin,19px);font-weight:' + weight + ';">' + name + '</button>';
  }).join('');
}
function selectSet(name) {
  currentSet = name;
  cards = sets[currentSet].data;
  idx = 0;
  flipped = false;
  document.getElementById("setBtn").textContent = name;
  render();
  toggleSetMenu();
}

render();
</script>
