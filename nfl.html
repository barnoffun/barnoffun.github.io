<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NFL Flashcards</title>
<link rel="nfl-logo" href="nfl-logo.png">
<style>
  :root {
    --surface-2: #ffffff;
    --surface-1: #f5f4f0;
    --text-primary: #1a1a1a;
    --text-secondary: #6b6b68;
    --text-muted: #9a9a96;
    --border: #dddad2;
    --border-strong: #c4c1b9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface-2: #232320;
      --surface-1: #2b2b28;
      --text-primary: #f2f2ef;
      --text-secondary: #b0b0ac;
      --text-muted: #85857f;
      --border: #3d3d38;
      --border-strong: #52524a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--surface-1);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-primary);
    overscroll-behavior: none;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: 3vmin;
  }
  button {
    background: var(--surface-2);
    border: 0.5px solid var(--border-strong);
    border-radius: 10px;
    color: var(--text-primary);
    font-family: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:active { transform: scale(0.98); background: var(--surface-1); }
</style>
</head>
<body>

<div style="display:flex;flex-direction:column;height:94vh;position:relative;">

<p style="font-size:clamp(12px,3vmin,16px);color:var(--text-secondary);margin:0 0 1.5vh;text-align:center;flex:0 0 auto;" id="progress">Card 1 of 32</p>

<div id="card" onclick="flipCard()" style="cursor:pointer;background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;flex:1 1 auto;display:flex;align-items:center;justify-content:center;text-align:center;padding:3vmin;min-height:0;overflow-y:auto;">
  <div id="face-inner" style="width:100%;">
    <p style="font-size:clamp(13px,3.2vmin,17px);color:var(--text-secondary);margin:0 0 2vh;">Team</p>
    <p style="font-size:clamp(26px,9vmin,46px);font-weight:600;margin:0;line-height:1.2;">Buffalo Bills</p>
  </div>
</div>

<div style="flex:0 0 auto;margin-top:1.5vh;">
  <button onclick="flipCard()" style="width:100%;padding:0;height:9vh;font-size:clamp(18px,5.5vmin,26px);">Flip</button>
  <div style="display:flex;gap:2vw;margin-top:1.5vh;">
    <button onclick="prevCard()" style="flex:1;padding:0;height:8vh;font-size:clamp(15px,4.5vmin,20px);">&larr; Prev</button>
    <button onclick="nextCard()" style="flex:1;padding:0;height:8vh;font-size:clamp(15px,4.5vmin,20px);">Next &rarr;</button>
  </div>
  <button onclick="shuffleCards()" style="width:100%;padding:0;height:8vh;margin-top:1.5vh;font-size:clamp(15px,4.5vmin,20px);">&#8635; Shuffle</button>
  <button onclick="toggleSetMenu()" id="setBtn" style="width:100%;padding:0;height:8vh;margin-top:1.5vh;font-size:clamp(15px,4.5vmin,20px);font-weight:600;">QB</button>
</div>

</div>

<div id="setOverlay" onclick="if(event.target===this){toggleSetMenu();}" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);align-items:flex-end;justify-content:center;z-index:50;">
  <div style="background:var(--surface-2);width:100%;max-width:480px;border-radius:16px 16px 0 0;padding:3vmin 3vmin calc(3vmin + env(safe-area-inset-bottom,0px));">
    <p style="font-size:clamp(13px,3.2vmin,16px);color:var(--text-secondary);margin:0 0 1.5vh;text-align:center;">Choose a set</p>
    <div id="setList"></div>
  </div>
</div>

let currentSet = "QB";
let cards = sets[currentSet].data;
let idx = 0;
let flipped = false;

function render() {
  document.getElementById("progress").textContent = "Card " + (idx+1) + " of " + cards.length;
  let inner = document.getElementById("face-inner");
  let type = sets[currentSet].type;
  if (!flipped) {
    inner.innerHTML = '<p style="font-size:clamp(13px,3.2vmin,17px);color:var(--text-secondary);margin:0 0 2vh;">Team</p>' +
      '<p style="font-size:clamp(26px,9vmin,46px);font-weight:600;margin:0;line-height:1.2;">' + cards[idx][0] + '</p>';
  } else if (type === "roster") {
    let rows = cards[idx][1].map(function(qb, i) {
      let weight = i === 0 ? '600' : '400';
      let color = i === 0 ? 'var(--text-primary)' : 'var(--text-secondary)';
      let college = qb[3] ? '<div style="font-size:clamp(13px,3.4vmin,16px);color:var(--text-muted);margin-top:0.3vh;">' + qb[3] + '</div>' : '';
      return '<div style="padding:1.2vh 0;">' +
        '<div style="display:flex;gap:2vw;align-items:baseline;justify-content:center;flex-wrap:wrap;">' +
        '<span style="font-size:clamp(13px,3.4vmin,16px);color:var(--text-muted);">#' + qb[0] + '</span>' +
        '<span style="font-size:clamp(18px,5vmin,22px);font-weight:' + weight + ';color:' + color + ';">' + qb[1] + '</span>' +
        '<span style="font-size:clamp(13px,3.4vmin,16px);color:var(--text-muted);">(' + qb[2] + ')</span>' +
        '</div>' + college +
        '</div>';
    }).join('');
    inner.innerHTML = '<p style="font-size:clamp(13px,3.2vmin,17px);color:var(--text-secondary);margin:0 0 1.5vh;">' + cards[idx][0] + ' quarterbacks</p>' + rows;
  } else {
    let rows = cards[idx][1].map(function(person) {
      return '<div style="padding:1.2vh 0;">' +
        '<span style="font-size:clamp(17px,4.6vmin,21px);font-weight:600;color:var(--text-primary);">' + person[1] + '</span>' +
        '<div style="font-size:clamp(13px,3.4vmin,16px);color:var(--text-muted);margin-top:0.3vh;">' + person[0] + ' &middot; ' + person[2] + '</div>' +
        '</div>';
    }).join('');
    inner.innerHTML = '<p style="font-size:clamp(13px,3.2vmin,17px);color:var(--text-secondary);margin:0 0 1.5vh;">' + cards[idx][0] + ' coaching staff</p>' + rows;
  }
}
function flipCard() {
  flipped = !flipped;
  render();
}
function nextCard() {
  idx = (idx+1) % cards.length;
  flipped = false;
  render();
}
function prevCard() {
  idx = (idx-1+cards.length) % cards.length;
  flipped = false;
  render();
}
function shuffleCards() {
  for (let i = cards.length-1; i>0; i--) {
    let j = Math.floor(Math.random()*(i+1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  idx = 0;
  flipped = false;
  render();
}

function toggleSetMenu() {
  let overlay = document.getElementById("setOverlay");
  let isOpen = overlay.style.display === "flex";
  if (isOpen) {
    overlay.style.display = "none";
  } else {
    renderSetList();
    overlay.style.display = "flex";
  }
}
function renderSetList() {
  let list = document.getElementById("setList");
  let names = Object.keys(sets);
  list.innerHTML = names.map(function(name) {
    let active = name === currentSet;
    let bg = active ? 'var(--surface-1)' : 'transparent';
    let weight = active ? '600' : '400';
    return '<button onclick="selectSet(\'' + name + '\')" style="width:100%;text-align:left;padding:2.2vh 3vmin;margin-bottom:1vh;background:' + bg + ';border:0.5px solid var(--border);border-radius:10px;font-size:clamp(15px,4.2vmin,19px);font-weight:' + weight + ';">' + name + '</button>';
  }).join('');
}
function selectSet(name) {
  currentSet = name;
  cards = sets[currentSet].data;
  idx = 0;
  flipped = false;
  document.getElementById("setBtn").textContent = name;
  render();
  toggleSetMenu();
}

render();
</script>

</html>
